<!DOCTYPE html>
<html lang="en">
<head>
<script>/* Plan Preview safety guard: this page still calls the production API, so it never runs on plan-preview.qraivy.com. */if(location.hostname==='plan-preview.qraivy.com'){location.replace('/dashboard.html?planPreviewBlocked=1');document.write('<plaintext style="display:none">');}</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QRAIVY — Stamp Scanner</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=DM+Mono:wght@400&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js" data-clerk-publishable-key="pk_live_Y2xlcmsucXJhaXZ5LmNvbSQ" type="text/javascript" onload="window.Clerk.load()"></script>
  <!-- jsQR — pure JS QR decoder, no native deps -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0a0a0a;color:#f0ece0;font-family:'DM Mono',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px}
    .wrap{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
    .header{display:flex;align-items:center;gap:10px;margin-bottom:4px}
    .header-back{background:none;border:none;color:#ff5a1f;font-size:.8rem;cursor:pointer;font-family:inherit;padding:0}
    .title{font-family:'Space Grotesk',system-ui,sans-serif;font-size:1.5rem;font-weight:800}
    .sub{font-size:.74rem;color:rgba(240,244,248,0.5);line-height:1.6;margin-bottom:4px}
    .select-wrap{background:#111;border:1px solid rgba(255,255,255,0.08);border-radius:10px;overflow:hidden}
    .select-wrap select{width:100%;background:transparent;border:none;padding:12px 14px;color:#f0ece0;font-family:inherit;font-size:.85rem;outline:none;cursor:pointer}
    .camera-box{position:relative;width:100%;aspect-ratio:1;background:#111;border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,0.08)}
    .camera-box video{width:100%;height:100%;object-fit:cover;display:block}
    .camera-box canvas{display:none}
    .scan-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .scan-frame{width:65%;aspect-ratio:1;border:2.5px solid #ff5a1f;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,0.45)}
    .scan-corner{position:absolute;width:20px;height:20px;border-color:#ff5a1f;border-style:solid}
    .tl{top:17%;left:17%;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
    .tr{top:17%;right:17%;border-width:3px 3px 0 0;border-radius:0 4px 0 0}
    .bl{bottom:17%;left:17%;border-width:0 0 3px 3px;border-radius:0 0 0 4px}
    .br{bottom:17%;right:17%;border-width:0 3px 3px 0;border-radius:0 0 4px 0}
    .camera-hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:.66rem;color:rgba(240,244,248,0.5)}
    .btn{width:100%;padding:14px;border-radius:10px;font-family:'Space Grotesk',system-ui,sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;border:none;transition:all .15s}
    .btn-primary{background:#ff5a1f;color:#fff}
    .btn-primary:hover{background:#e04e18}
    .btn-secondary{background:rgba(255,255,255,0.06);color:rgba(240,244,248,0.7);border:1px solid rgba(255,255,255,0.08)}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .result{border-radius:12px;padding:16px;font-size:.82rem;line-height:1.6;text-align:center}
    .result.ok{background:rgba(34,212,126,0.1);border:1px solid rgba(34,212,126,0.3);color:#22d47e}
    .result.err{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);color:#f87171}
    .result.info{background:rgba(255,90,31,0.08);border:1px solid rgba(255,90,31,0.2);color:#ff8c55}
    .stamp-big{font-size:2.5rem;margin-bottom:6px}
    .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff5a1f;animation:pulse 1.2s ease infinite;margin-right:6px}
    @keyframes pulse{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
    #start-btn{margin-top:4px}
    #manual-section{display:none;margin-top:4px}
    .manual-input{width:100%;background:#111;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:11px 13px;color:#f0ece0;font-family:inherit;font-size:.8rem;outline:none;margin-bottom:8px}
    .manual-input:focus{border-color:#ff5a1f}
    .divider{display:flex;align-items:center;gap:10px;color:rgba(240,244,248,0.25);font-size:.7rem}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.07)}
    /* PIN gate */
    #pin-gate{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:20px;width:100%;max-width:320px;text-align:center}
    .pin-logo{font-family:'Space Grotesk',system-ui,sans-serif;font-size:2.5rem;font-weight:800;color:#ff5a1f}
    .pin-title{font-family:'Space Grotesk',system-ui,sans-serif;font-size:1.25rem;font-weight:700}
    .pin-sub{font-size:.74rem;color:rgba(240,244,248,0.4);line-height:1.6}
    .pin-dots{display:flex;gap:12px;justify-content:center;margin:4px 0}
    .pin-dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.15);transition:all .15s}
    .pin-dot.filled{background:#ff5a1f;border-color:#ff5a1f}
    .pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
    .pin-key{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:18px 0;font-family:'Space Grotesk',system-ui,sans-serif;font-size:1.2rem;font-weight:700;color:#f0ece0;cursor:pointer;transition:all .12s;-webkit-tap-highlight-color:transparent}
    .pin-key:active{background:rgba(255,90,31,0.18);border-color:#ff5a1f;transform:scale(.95)}
    .pin-key.wide{grid-column:span 1}
    .pin-key.del{color:rgba(240,244,248,0.5);font-size:.9rem}
    .pin-err{color:#f87171;font-size:.75rem;min-height:18px}
    /* Access check / sign-in required */
    .access-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:16px;width:100%;max-width:340px;text-align:center}
    a.btn{display:block;text-align:center;text-decoration:none}
    .access-link{color:#ff5a1f;font-size:.75rem;text-decoration:none}
    button.access-link{background:none;border:0;padding:0;cursor:pointer;font-family:inherit}
  </style>
</head>
<body>
<!-- Access check — nothing to scan with until the server has confirmed the
     owner's sign-in or the staff PIN for this business. -->
<div id="access-check" class="access-panel">
  <div class="pin-logo">Q</div>
  <p class="pin-sub"><span class="status-dot"></span><span data-i18n="ss_checking">Checking access…</span></p>
</div>
<div id="access-denied" class="access-panel" style="display:none">
  <div class="pin-logo">Q</div>
  <div class="pin-title" id="access-title">Sign in required</div>
  <p class="pin-sub" id="access-msg"></p>
  <a id="access-signin" class="btn btn-primary" href="login.html" data-i18n="ss_signin">Sign in as owner</a>
  <button id="access-switch" class="btn btn-primary" style="display:none" onclick="switchAccount()" data-i18n="ss_switch">Sign out and use another account</button>
  <button id="access-retry" class="btn btn-secondary" style="display:none" onclick="retryAccess()" data-i18n="ss_retry">Try again</button>
</div>

<!-- PIN gate — shown before scanner if no PIN verified yet -->
<div id="pin-gate" style="display:none">
  <div class="pin-logo">Q</div>
  <div class="pin-title" data-i18n="ss_pin_title">Staff Access</div>
  <p class="pin-sub" data-i18n="ss_pin_sub">Enter your staff PIN to open the stamp scanner.</p>
  <div class="pin-dots" id="pin-dots">
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
  </div>
  <div class="pin-err" id="pin-err"></div>
  <div class="pin-grid">
    <button class="pin-key" onclick="pinKey('1')">1</button>
    <button class="pin-key" onclick="pinKey('2')">2</button>
    <button class="pin-key" onclick="pinKey('3')">3</button>
    <button class="pin-key" onclick="pinKey('4')">4</button>
    <button class="pin-key" onclick="pinKey('5')">5</button>
    <button class="pin-key" onclick="pinKey('6')">6</button>
    <button class="pin-key" onclick="pinKey('7')">7</button>
    <button class="pin-key" onclick="pinKey('8')">8</button>
    <button class="pin-key" onclick="pinKey('9')">9</button>
    <button class="pin-key" onclick="pinKey('0')" style="grid-column:2">0</button>
    <button class="pin-key del" onclick="pinDel()">⌫</button>
  </div>
  <a id="pin-signin" class="access-link" href="login.html" data-i18n="ss_pin_owner">Owner? Sign in instead</a>
  <button id="pin-switch" class="access-link" style="display:none" onclick="switchAccount()" data-i18n="ss_switch">Sign out and use another account</button>
</div>

<div class="wrap" id="scanner-wrap" style="display:none">
  <div style="margin-bottom:4px">
    <button class="header-back" onclick="history.back()" data-i18n="ss_back">← Back</button>
  </div>
  <div>
    <div class="title" data-i18n="ss_title">Stamp Scanner</div>
    <p class="sub" style="margin-top:6px" data-i18n="ss_sub">Point your camera at a customer's loyalty pass barcode to add a stamp directly against their identity.</p>
  </div>

  <div class="select-wrap" id="slug-wrap">
    <select id="slug-select"><option value="">Loading your programs…</option></select>
  </div>

  <div class="camera-box" id="camera-box" style="display:none">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <div class="scan-overlay">
      <div class="scan-frame"></div>
      <div class="scan-corner tl"></div>
      <div class="scan-corner tr"></div>
      <div class="scan-corner bl"></div>
      <div class="scan-corner br"></div>
    </div>
    <div class="camera-hint"><span class="status-dot"></span><span data-i18n="ss_scanning">Scanning…</span></div>
  </div>

  <div id="result-box"></div>

  <button id="start-btn" class="btn btn-primary" onclick="startScanner()" data-i18n="ss_start">Start Camera Scanner</button>

  <div class="divider"><span data-i18n="ss_or_manual">or enter manually</span></div>

  <div id="manual-section">
    <input id="manual-url" class="manual-input" type="text" data-i18n-ph="ss_manual_ph" placeholder="Paste barcode URL (https://api.qraivy.com/lp/…?cid=…)" />
    <button class="btn btn-secondary" onclick="stampFromUrl(document.getElementById('manual-url').value)">Stamp from URL</button>
  </div>
  <button class="btn btn-secondary" style="font-size:.75rem" onclick="toggleManual()" data-i18n="ss_enter_manual">Enter barcode URL manually instead</button>
</div>

<script>
(function(){
  'use strict';
  // ── Which API this scanner may talk to (default deny) ──
  //   www.qraivy.com, qraivy.com   production API (https://api.qraivy.com)
  //   deals-preview.qraivy.com     the isolated staging API (its own database),
  //                                never production
  //   localhost, 127.0.0.1         a local test server, never production
  //   anything else                blocked: Vercel deployment addresses, other
  //                                preview domains. The scanner sends no
  //                                request at all and says why.
  // A blocked page gets an address no request can leave through (not even a
  // relative one, which Vercel would forward to production).
  var BLOCKED_API = 'about:blank#qraivy-api-blocked';
  function resolveApi(hostname, localApi){
    var host = String(hostname || '').toLowerCase();
    if(host === 'www.qraivy.com' || host === 'qraivy.com') return { mode: 'production', api: 'https://api.qraivy.com', blocked: false };
    if(host === 'deals-preview.qraivy.com') return { mode: 'staging', api: 'https://qraivy-deals-api-deals-preview.up.railway.app', blocked: false };
    if(host === 'localhost' || host === '127.0.0.1'){
      var u = null;
      try{ u = new URL(String(localApi || '')); }catch(_){ u = null; }
      var ok = u && (u.protocol === 'http:' || u.protocol === 'https:') && (u.hostname === 'localhost' || u.hostname === '127.0.0.1');
      return { mode: 'local', api: ok ? u.origin : BLOCKED_API, blocked: !ok };
    }
    return { mode: 'unknown-host', api: BLOCKED_API, blocked: true };
  }
  var ROUTING = resolveApi(window.location.hostname, window.QRAIVY_SCANNER_LOCAL_API || window.location.origin);
  window.QraivyScannerRouting = { resolve: resolveApi, current: ROUTING };
  var API = ROUTING.api;
  var PIN_LEN = 4;
  var pinBuffer = '';
  var pinSlug = new URLSearchParams(window.location.search).get('slug') || '';
  var scanning = false;
  var animFrame = null;
  // The one business the scanner is unlocked for. Set only after the server
  // handed out that business's stamp code (owner sign-in or staff PIN);
  // scanning, manual entry and stamping refuse every other business.
  var authorizedSlug = null;
  var gateSlug = '';   // the business the PIN / sign-in screen is for
  var authSeq = 0;     // only the latest access check may change the screen

  function tr(k, fallback){ return (window.SS_T && window.SS_T[k]) || fallback; }

  // ── Screens: exactly one is visible, the scanner only once authorized ──
  var VIEWS = ['access-check', 'access-denied', 'pin-gate', 'scanner-wrap'];
  function showView(id){
    VIEWS.forEach(function(v){
      var el = document.getElementById(v);
      if(el) el.style.display = v === id ? 'flex' : 'none';
    });
  }
  // This scanner again (same host, relative): only the business slug.
  function scannerHref(){
    return 'stamp-scanner.html' + (gateSlug ? '?slug=' + encodeURIComponent(gateSlug) : '');
  }
  function signInHref(){
    return 'login.html?redirect=' + encodeURIComponent(scannerHref());
  }
  // A signed-in visitor who is refused here cannot "sign in": login.html
  // sends a signed-in visitor straight back. They get "Sign out and use
  // another account" instead; the staff PIN stays available.
  function isSignedIn(){ return !!(window.Clerk && window.Clerk.user); }
  function showPinGate(msg){
    pinBuffer = ''; updatePinDots();
    document.getElementById('pin-err').textContent = msg || '';
    var signedIn = isSignedIn();
    var signin = document.getElementById('pin-signin');
    signin.href = signInHref();
    signin.style.display = signedIn ? 'none' : '';
    document.getElementById('pin-switch').style.display = signedIn ? '' : 'none';
    showView('pin-gate');
  }
  function showDenied(title, msg, opts){
    opts = opts || {};
    document.getElementById('access-title').textContent = title;
    document.getElementById('access-msg').textContent = msg || '';
    var signedIn = isSignedIn();
    var signin = document.getElementById('access-signin');
    signin.href = signInHref();
    signin.style.display = opts.noSignIn || signedIn ? 'none' : 'block';
    document.getElementById('access-switch').style.display = signedIn && (!opts.noSignIn || opts.switchAccount) ? 'block' : 'none';
    document.getElementById('access-retry').style.display = opts.retry ? 'block' : 'none';
    showView('access-denied');
  }
  function lockScanner(){
    authorizedSlug = null;
    currentToken = null;
    if(scanning) stopScanner();
  }

  // ── PIN gate ──
  function updatePinDots(){
    var dots = document.querySelectorAll('.pin-dot');
    dots.forEach(function(d,i){ d.classList.toggle('filled', i < pinBuffer.length); });
  }

  window.pinKey = function(k){
    if(pinBuffer.length >= PIN_LEN) return;
    pinBuffer += k;
    updatePinDots();
    document.getElementById('pin-err').textContent = '';
    if(pinBuffer.length === PIN_LEN) submitPin();
  };

  window.pinDel = function(){
    pinBuffer = pinBuffer.slice(0,-1);
    updatePinDots();
  };

  async function submitPin(){
    var slug = gateSlug;
    if(!slug){ document.getElementById('pin-err').textContent = 'No program slug in URL.'; pinBuffer=''; updatePinDots(); return; }
    try{
      var res = await fetch(API+'/lp/staff-pin/'+encodeURIComponent(slug)+'/verify', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({pin: pinBuffer})
      });
      var d = {};
      try{ d = await res.json(); }catch(_){}
      if(res.ok && d.ok){
        // The server checks the PIN again on every stamp code request
        // (fetchToken), so it is kept for this browser session; the scanner
        // opens only once that code request has succeeded too.
        sessionStorage.setItem('staff_pin_'+slug, pinBuffer);
        pinBuffer=''; updatePinDots();
        authorize(slug);
      } else {
        document.getElementById('pin-err').textContent = res.status === 429 ? tr('ss_pin_locked','Too many incorrect PINs. Please wait 15 minutes and try again.') : d.error === 'No PIN set for this page.' ? tr('ss_pin_none','No PIN set yet') : tr('ss_pin_wrong','Incorrect PIN. Try again.');
        pinBuffer=''; updatePinDots();
      }
    }catch(e){
      document.getElementById('pin-err').textContent = tr('ss_net_err','Network error. Check connection.');
      pinBuffer=''; updatePinDots();
    }
  }

  // Whether the business has a staff PIN (existence only, no PIN guess):
  // true / false, or null when the answer is unknown.
  function pinConfigured(slug){
    return fetch(API+'/lp/staff-pin/'+encodeURIComponent(slug)+'/status', {method:'GET'})
      .then(function(r){ return r.json(); })
      .then(function(d){ return (d && d.configured === true) ? true : (d && d.configured === false) ? false : null; })
      .catch(function(){ return null; });
  }

  function forgetPin(slug){
    try{ sessionStorage.removeItem('staff_pin_'+slug); sessionStorage.removeItem('staff_pin_ok_'+slug); }catch(_){}
  }

  var stream = null;
  var currentToken = null;
  var lastStampedCid = null;
  var lastStampTime = 0;
  var DEDUPE_MS = 3000; // ignore same cid re-scan within 3s

  // ── Auth ──
  async function getToken(){
    try{ if(window.Clerk&&window.Clerk.session) return await window.Clerk.session.getToken(); }catch(_){}
    return null;
  }

  // ── Load programs ──
  async function loadPrograms(){
    var sel = document.getElementById('slug-select');
    var slugWrap = document.getElementById('slug-wrap');
    // If slug is in the URL, use it directly — staff don't have a logged-in
    // session so the programs API won't work for them anyway.
    if(pinSlug){
      var fixed = document.createElement('option');
      fixed.value = pinSlug;
      fixed.textContent = pinSlug;
      sel.innerHTML = '';
      sel.appendChild(fixed);
      sel.value = pinSlug;
      if(slugWrap) slugWrap.style.display = 'none'; // hide dropdown, slug is fixed
      return;
    }
    // No slug in URL — must be the owner accessing directly, try to load list
    try{
      var tok = await getToken();
      var h = tok ? {'Authorization':'Bearer '+tok} : {};
      var res = await fetch(API+'/loyalty/programs?_='+Date.now(), {headers:h});
      var data = await res.json();
      var progs = (data && data.programs) || [];
      sel.innerHTML = '';
      if(!progs.length){
        sel.innerHTML = '<option value="">No loyalty programs found — add ?slug=YOUR-SLUG to the URL</option>';
        return;
      }
      progs.forEach(function(p){
        var o = document.createElement('option');
        o.value = p.slug;
        o.textContent = p.businessName || p.slug;
        sel.appendChild(o);
      });
      // Switching business locks the scanner until that one is authorized.
      sel.onchange = function(){ authorize(sel.value); };
    }catch(e){
      sel.innerHTML = '<option value="">Add ?slug=YOUR-SLUG to the URL</option>';
    }
  }

  // ── Fetch stamp token ──
  // The server hands out the stamp code only to the owner's sign-in or with
  // the staff PIN (X-Staff-Pin); both are sent when present.
  async function requestCode(slug){
    var h = {};
    var tok = await getToken();
    if(tok) h['Authorization'] = 'Bearer '+tok;
    var pin = null;
    try{ pin = sessionStorage.getItem('staff_pin_'+slug); }catch(_){}
    if(pin) h['X-Staff-Pin'] = pin;
    var res = await fetch(API+'/lp/stamp/token/'+encodeURIComponent(slug), {headers:h});
    var d = {};
    try{ d = await res.json(); }catch(_){}
    return { status: res.status, token: (res.ok && d.token) ? d.token : null, error: d.error, signedIn: !!tok, sentPin: !!pin };
  }

  async function fetchToken(slug){
    var r = await requestCode(slug);
    if(!r.token){
      // Signed out, PIN changed or locked since the scanner opened: lock it
      // and show the way back in (without asking the server a second time).
      if(r.status === 401 || r.status === 403 || r.status === 429) authorize(slug, 'expired', r);
      throw new Error(r.error || 'Could not get a stamp code.');
    }
    return r.token;
  }

  // ── Access check ──
  // Opens the scanner only when the server hands out this business's stamp
  // code; otherwise shows the PIN screen (business has a staff PIN) or the
  // sign-in screen (it has none). `known` reuses an answer already received.
  async function authorize(slug, why, known){
    var seq = ++authSeq;
    lockScanner();
    gateSlug = slug || '';
    showView('access-check');
    var r = known;
    if(!r){
      try{ r = await requestCode(slug); }
      catch(e){ r = null; }
      if(seq !== authSeq) return;
    }
    if(!r || r.status >= 500){
      showDenied(tr('ss_net_title','Connection problem'), tr('ss_net_err','Network error. Check connection.'), {retry:true, noSignIn:true});
      return;
    }
    if(r.token){
      authorizedSlug = slug;
      document.getElementById('result-box').innerHTML = '';
      showView('scanner-wrap');
      return;
    }
    if(r.status === 404){
      showDenied(tr('ss_unknown_title','Program not found'), tr('ss_unknown_msg','This scanner link does not belong to an active business. Ask the owner for the current link.'), {noSignIn:true});
      return;
    }
    if(r.sentPin) forgetPin(slug);
    var msg = why === 'expired' ? tr('ss_expired','Your session has expired or access was withdrawn.') + ' '
      : '';
    if(r.status === 429) msg += tr('ss_pin_locked','Too many incorrect PINs. Please wait 15 minutes and try again.');
    else if(r.sentPin) msg += tr('ss_pin_invalid','The saved staff PIN was not accepted. Please enter it again.');
    else if(r.signedIn) msg += tr('ss_not_owner','This account is not the owner of this business.');
    var configured = await pinConfigured(slug);
    if(seq !== authSeq) return;
    if(configured === false){
      showDenied(tr('ss_signin_title','Sign in required'), (msg ? msg.trim() + ' ' : '') + tr('ss_signin_msg','Only the business owner, or staff with a staff PIN, can use the stamp scanner. This business has no staff PIN yet: sign in as the owner, or ask the owner to set a staff PIN in the dashboard.'));
    } else {
      showPinGate(msg.trim());
    }
  }

  window.retryAccess = function(){ if(gateSlug) authorize(gateSlug); else boot(); };

  // ── Switch account ──
  // Clerk signs the visitor out; then this scanner address loads again,
  // signed out: the PIN screen or the sign-in screen, never the scanner.
  // This business's saved staff PIN is dropped as well.
  var switching = false;
  window.switchAccount = async function(){
    if(switching) return;
    switching = true;
    var href = scannerHref();
    lockScanner();
    if(gateSlug) forgetPin(gateSlug);
    try{
      await window.Clerk.signOut();
    }catch(_){
      switching = false;
      var err = tr('ss_switch_err','Could not sign out. Please try again.');
      if(document.getElementById('pin-gate').style.display !== 'none') document.getElementById('pin-err').textContent = err;
      else document.getElementById('access-msg').textContent = err;
      return;
    }
    showView('access-check');
    window.location.replace(href);
  };

  // ── Extract cid from scanned URL ──
  function extractCid(url){
    try{
      var u = new URL(url);
      return u.searchParams.get('cid') || null;
    }catch(_){ return null; }
  }

  function extractSlug(url){
    try{
      var u = new URL(url);
      var parts = u.pathname.split('/').filter(Boolean);
      // path is /lp/{slug} (also /lp/card/{slug} and /lp/welcome/{slug})
      var idx = parts.indexOf('lp');
      if(idx >= 0 && (parts[idx+1] === 'card' || parts[idx+1] === 'welcome')) idx++;
      return idx >= 0 && parts[idx+1] ? parts[idx+1] : null;
    }catch(_){ return null; }
  }

  function setLocked(){ setResult('err','🔒',tr('ss_locked','Scanner locked'),''); }
  function setOtherBusiness(){ setResult('err','❌',tr('ss_other_business','This pass belongs to another business'),tr('ss_other_business_sub','This scanner is open only for the business it was unlocked for.')); }

  // ── Stamp action ──
  async function doStamp(slug, cid){
    if(!authorizedSlug || slug !== authorizedSlug){ setLocked(); return; }
    setResult('info', '⏳', 'Stamping…', '');
    try{
      if(!currentToken) currentToken = await fetchToken(slug);
      var res = await fetch(API+'/stamp/'+encodeURIComponent(slug)+'/'+currentToken+'/confirm', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({cid: cid})
      });
      var d = await res.json();
      currentToken = null; // token may be consumed/rotated — fetch fresh next time
      if(d.status === 'ok'){
        setResult('ok','✅','Stamp added!', d.newCount+' of '+d.goal+' stamps — '+d.rewardName);
        lastStampedCid = cid;
        lastStampTime = Date.now();
      } else if(d.status === 'already'){
        setResult('info','⏱️','Already stamped','This customer already got a stamp recently. Come back next visit!');
        lastStampedCid = cid;
        lastStampTime = Date.now();
      } else if(d.status === 'invalid'){
        currentToken = null;
        setResult('err','❌','Invalid token','Please try again.');
      } else {
        setResult('err','⚠️','Something went wrong', JSON.stringify(d));
      }
    }catch(e){
      setResult('err','❌','Error',e.message);
    }
  }

  // ── Stamp from URL string (manual entry or scan result) ──
  window.stampFromUrl = async function(url){
    if(!authorizedSlug){ setLocked(); return; }
    if(!url || !url.trim()){ setResult('err','❌','No URL','Please scan or paste a barcode URL.'); return; }
    url = url.trim();
    var cid = extractCid(url);
    var slugFromUrl = extractSlug(url);
    var slug = authorizedSlug;
    if(slugFromUrl && slugFromUrl !== slug){ setOtherBusiness(); return; }
    if(!cid){ setResult('err','❌','No customer ID','This barcode doesn\'t contain a customer ID. Make sure customers add the wallet pass fresh so the new barcode is generated.'); return; }
    await doStamp(slug, cid);
  };

  // ── UI result display ──
  function setResult(type, icon, title, sub){
    var box = document.getElementById('result-box');
    box.innerHTML = '<div class="result '+type+'"><div class="stamp-big">'+icon+'</div><strong>'+title+'</strong>'+(sub?'<br><span style="font-size:.75rem;opacity:.8">'+sub+'</span>':'')+'</div>';
  }

  // ── Camera scanner ──
  window.startScanner = async function(){
    var box = document.getElementById('camera-box');
    var btn = document.getElementById('start-btn');
    if(scanning){ stopScanner(); return; }
    if(!authorizedSlug){ setLocked(); return; }
    try{
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
      var video = document.getElementById('video');
      video.srcObject = stream;
      await video.play();
      box.style.display = 'block';
      btn.textContent = (window.SS_T&&window.SS_T.ss_stop)||'Stop Scanner';
      btn.className = 'btn btn-secondary';
      scanning = true;
      tickScan();
    }catch(e){
      setResult('err','❌',(window.SS_T&&window.SS_T.ss_cam_err)||'Camera error',e.message);
      document.getElementById('manual-section').style.display='block';
    }
  };

  function stopScanner(){
    scanning = false;
    if(animFrame) cancelAnimationFrame(animFrame);
    if(stream) stream.getTracks().forEach(function(t){t.stop();});
    stream = null;
    document.getElementById('camera-box').style.display='none';
    var btn = document.getElementById('start-btn');
    btn.textContent = (window.SS_T&&window.SS_T.ss_start)||'Start Camera Scanner';
    btn.className = 'btn btn-primary';
  }

  function tickScan(){
    if(!scanning) return;
    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');
    if(video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var code = jsQR(imageData.data, imageData.width, imageData.height, {inversionAttempts:'dontInvert'});
      if(code && code.data){
        var url = code.data;
        var cid = extractCid(url);
        // dedupe: ignore same cid for 3 seconds
        if(cid && !(cid === lastStampedCid && Date.now() - lastStampTime < DEDUPE_MS)){
          var slug = authorizedSlug;
          if(slug){
            stopScanner();
            var barcodeSlug = extractSlug(url);
            if(barcodeSlug && barcodeSlug !== slug){ setOtherBusiness(); return; }
            doStamp(slug, cid);
            return;
          }
        }
      }
    }
    animFrame = requestAnimationFrame(tickScan);
  }

  window.toggleManual = function(){
    var s = document.getElementById('manual-section');
    s.style.display = s.style.display === 'none' ? 'block' : 'none';
  };

  // ── Boot ──
  // Clerk decides who is signed in: wait for it (at most 10 s, then the
  // visitor counts as signed out) before asking the server for access.
  function clerkReady(){
    if(!window.Clerk) return Promise.resolve();
    var load;
    try{ load = Promise.resolve(window.Clerk.load()); }catch(_){ load = Promise.resolve(); }
    return Promise.race([load.catch(function(){}), new Promise(function(r){ setTimeout(r, 10000); })]);
  }

  function boot(){
    if(ROUTING.blocked){
      showDenied(tr('ss_blocked_title','Scanner not available here'), tr('ss_blocked_msg','The stamp scanner only works on www.qraivy.com. Open the scanner link from your dashboard.'), {noSignIn:true});
      return Promise.resolve();
    }
    showView('access-check');
    return clerkReady().then(async function(){
      // Staff open the scanner with ?slug= and the staff PIN, without an
      // account; the owner can use the same link signed in.
      if(pinSlug){ await loadPrograms(); return authorize(pinSlug); }
      // Without ?slug= it is the owner's view: their programs, their sign-in.
      gateSlug = '';
      if(!(window.Clerk && window.Clerk.user)){
        showDenied(tr('ss_signin_title','Sign in required'), tr('ss_signin_owner','Sign in with your QRAIVY account to use the stamp scanner.'));
        return;
      }
      await loadPrograms();
      var sel = document.getElementById('slug-select');
      if(!sel.value){
        showDenied(tr('ss_noprog_title','No loyalty program'), tr('ss_noprog_msg','Your account has no loyalty program yet. Set one up in the dashboard first.'), {noSignIn:true, switchAccount:true});
        return;
      }
      return authorize(sel.value);
    });
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
