<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>QRAIVY — Stamp Scanner</title>
  <meta name="robots" content="noindex, nofollow" />
  <script src="js/url-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800&family=DM+Mono:wght@400&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js" data-clerk-publishable-key="pk_live_Y2xlcmsucXJhaXZ5LmNvbSQ" type="text/javascript" onload="window.Clerk.load()"></script>
  <!-- jsQR — pure JS QR decoder, no native deps -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0a0a0a;color:#f0ece0;font-family:'DM Mono',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px}
    .wrap{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
    .header{display:flex;align-items:center;gap:10px;margin-bottom:4px}
    .header-back{background:none;border:none;color:#ff5a1f;font-size:.8rem;cursor:pointer;font-family:inherit;padding:0}
    .title{font-family:'Space Grotesk',system-ui,sans-serif;font-size:1.5rem;font-weight:800}
    .sub{font-size:.74rem;color:rgba(240,244,248,0.5);line-height:1.6;margin-bottom:4px}
    .select-wrap{background:#111;border:1px solid rgba(255,255,255,0.08);border-radius:10px;overflow:hidden}
    .select-wrap select{width:100%;background:transparent;border:none;padding:12px 14px;color:#f0ece0;font-family:inherit;font-size:.85rem;outline:none;cursor:pointer}
    .camera-box{position:relative;width:100%;aspect-ratio:1;background:#111;border-radius:14px;overflow:hidden;border:2px solid rgba(255,255,255,0.08)}
    .camera-box video{width:100%;height:100%;object-fit:cover;display:block}
    .camera-box canvas{display:none}
    .scan-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
    .scan-frame{width:65%;aspect-ratio:1;border:2.5px solid #ff5a1f;border-radius:12px;box-shadow:0 0 0 9999px rgba(0,0,0,0.45)}
    .scan-corner{position:absolute;width:20px;height:20px;border-color:#ff5a1f;border-style:solid}
    .tl{top:17%;left:17%;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
    .tr{top:17%;right:17%;border-width:3px 3px 0 0;border-radius:0 4px 0 0}
    .bl{bottom:17%;left:17%;border-width:0 0 3px 3px;border-radius:0 0 0 4px}
    .br{bottom:17%;right:17%;border-width:0 3px 3px 0;border-radius:0 0 4px 0}
    .camera-hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:.66rem;color:rgba(240,244,248,0.5)}
    .btn{width:100%;padding:14px;border-radius:10px;font-family:'Space Grotesk',system-ui,sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;border:none;transition:all .15s}
    .btn-primary{background:#ff5a1f;color:#fff}
    .btn-primary:hover{background:#e04e18}
    .btn-secondary{background:rgba(255,255,255,0.06);color:rgba(240,244,248,0.7);border:1px solid rgba(255,255,255,0.08)}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .result{border-radius:12px;padding:16px;font-size:.82rem;line-height:1.6;text-align:center}
    .result.ok{background:rgba(34,212,126,0.1);border:1px solid rgba(34,212,126,0.3);color:#22d47e}
    .result.err{background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.3);color:#f87171}
    .result.info{background:rgba(255,90,31,0.08);border:1px solid rgba(255,90,31,0.2);color:#ff8c55}
    .stamp-big{font-size:2.5rem;margin-bottom:6px}
    .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff5a1f;animation:pulse 1.2s ease infinite;margin-right:6px}
    @keyframes pulse{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
    #start-btn{margin-top:4px}
    #manual-section{display:none;margin-top:4px}
    .manual-input{width:100%;background:#111;border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:11px 13px;color:#f0ece0;font-family:inherit;font-size:.8rem;outline:none;margin-bottom:8px}
    .manual-input:focus{border-color:#ff5a1f}
    .divider{display:flex;align-items:center;gap:10px;color:rgba(240,244,248,0.25);font-size:.7rem}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.07)}
    /* PIN gate */
    #pin-gate{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:20px;width:100%;max-width:320px;text-align:center}
    .pin-logo{font-family:'Space Grotesk',system-ui,sans-serif;font-size:2.5rem;font-weight:800;color:#ff5a1f}
    .pin-title{font-family:'Space Grotesk',system-ui,sans-serif;font-size:1.25rem;font-weight:700}
    .pin-sub{font-size:.74rem;color:rgba(240,244,248,0.4);line-height:1.6}
    .pin-dots{display:flex;gap:12px;justify-content:center;margin:4px 0}
    .pin-dot{width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.15);transition:all .15s}
    .pin-dot.filled{background:#ff5a1f;border-color:#ff5a1f}
    .pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
    .pin-key{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:18px 0;font-family:'Space Grotesk',system-ui,sans-serif;font-size:1.2rem;font-weight:700;color:#f0ece0;cursor:pointer;transition:all .12s;-webkit-tap-highlight-color:transparent}
    .pin-key:active{background:rgba(255,90,31,0.18);border-color:#ff5a1f;transform:scale(.95)}
    .pin-key.wide{grid-column:span 1}
    .pin-key.del{color:rgba(240,244,248,0.5);font-size:.9rem}
    .pin-err{color:#f87171;font-size:.75rem;min-height:18px}
    .biz-avatar{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',system-ui,sans-serif;font-weight:800;font-size:1.4rem;color:#fff;overflow:hidden;flex-shrink:0}
    .biz-avatar img{width:100%;height:100%;object-fit:cover;display:block}
    .biz-name{font-family:'Space Grotesk',system-ui,sans-serif;font-size:1.05rem;font-weight:700}
    .scan-brand{display:flex;align-items:center;gap:10px;margin-bottom:2px}
    .scan-brand .biz-avatar{width:40px;height:40px;font-size:1rem}
    .lock-icon{font-size:2.4rem}
    /* Preview / confirm / success cards */
    .preview-card{background:#111;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:18px;text-align:left}
    .preview-title{font-family:'Space Grotesk',system-ui,sans-serif;font-size:1.05rem;font-weight:700;margin-bottom:14px;text-align:center}
    .preview-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.06);font-size:.82rem}
    .preview-row:last-of-type{border-bottom:none}
    .preview-label{color:rgba(240,244,248,0.5)}
    .preview-value{font-weight:700;text-align:right}
    .status-chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.68rem;font-weight:700;background:rgba(255,255,255,0.08);color:rgba(240,244,248,0.7)}
    .status-chip.ready{background:rgba(34,212,126,0.15);color:#22d47e}
    .btn-row{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  </style>
</head>
<body>
<!-- PIN gate — shown before scanner if no PIN verified yet -->
<div id="pin-gate" style="display:none">
  <div class="biz-avatar" id="pin-logo" style="background:#ff5a1f">Q</div>
  <div class="biz-name" id="pin-bizname"></div>
  <div class="pin-title" data-i18n="ss_pin_title">Staff Access</div>
  <p class="pin-sub" data-i18n="ss_pin_sub">Enter your staff PIN to open the stamp scanner.</p>
  <div class="pin-dots" id="pin-dots">
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
  </div>
  <div class="pin-err" id="pin-err"></div>
  <div class="pin-grid" id="pin-grid">
    <button class="pin-key" onclick="pinKey('1')">1</button>
    <button class="pin-key" onclick="pinKey('2')">2</button>
    <button class="pin-key" onclick="pinKey('3')">3</button>
    <button class="pin-key" onclick="pinKey('4')">4</button>
    <button class="pin-key" onclick="pinKey('5')">5</button>
    <button class="pin-key" onclick="pinKey('6')">6</button>
    <button class="pin-key" onclick="pinKey('7')">7</button>
    <button class="pin-key" onclick="pinKey('8')">8</button>
    <button class="pin-key" onclick="pinKey('9')">9</button>
    <button class="pin-key" onclick="pinKey('0')" style="grid-column:2">0</button>
    <button class="pin-key del" onclick="pinDel()">⌫</button>
  </div>
</div>

<!-- Shown when no Staff PIN is configured yet — no camera, no manual entry,
     no "Continue anyway". Only path forward is the owner setting a PIN in
     Loyalty Settings. -->
<div id="pin-locked" style="display:none;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:16px;width:100%;max-width:320px;text-align:center;margin:0 auto">
  <div class="biz-avatar" id="locked-logo" style="background:#ff5a1f">Q</div>
  <div class="biz-name" id="locked-bizname"></div>
  <div class="lock-icon">🔒</div>
  <div class="pin-title" data-i18n="ss_locked_title">Staff PIN not configured</div>
  <p class="pin-sub" data-i18n="ss_locked_sub">Set a Staff PIN in Loyalty Settings before using the scanner.</p>
  <button class="btn btn-primary" style="max-width:280px" onclick="window.location.href='dashboard.html?section=loyalty'" data-i18n="ss_back_dashboard">Back to Dashboard</button>
</div>

<div class="wrap" id="scanner-wrap" style="display:none">
  <div style="margin-bottom:4px">
    <button class="header-back" onclick="history.back()" data-i18n="ss_back">← Back</button>
  </div>
  <div class="scan-brand" id="scan-brand" style="display:none">
    <div class="biz-avatar" id="scan-logo" style="background:#ff5a1f">Q</div>
    <div class="biz-name" id="scan-bizname"></div>
  </div>
  <div>
    <div class="title" data-i18n="ss_title">Stamp Customer</div>
    <p class="sub" style="margin-top:6px" data-i18n="ss_sub">Scan the customer's Apple or Google Wallet loyalty card.</p>
  </div>

  <div class="select-wrap" id="slug-wrap">
    <select id="slug-select"><option value="">Loading your programs…</option></select>
  </div>

  <div class="camera-box" id="camera-box" style="display:none">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="canvas"></canvas>
    <div class="scan-overlay">
      <div class="scan-frame"></div>
      <div class="scan-corner tl"></div>
      <div class="scan-corner tr"></div>
      <div class="scan-corner bl"></div>
      <div class="scan-corner br"></div>
    </div>
    <div class="camera-hint"><span class="status-dot"></span><span data-i18n="ss_scanning">Scanning…</span></div>
  </div>

  <div id="result-box"></div>

  <button id="start-btn" class="btn btn-primary" onclick="startScanner()" data-i18n="ss_start">Start Camera Scanner</button>

  <div class="divider"><span data-i18n="ss_or_manual">or enter manually</span></div>

  <div id="manual-section">
    <input id="manual-url" class="manual-input" type="text" data-i18n-ph="ss_manual_ph" placeholder="Paste barcode URL (https://api.qraivy.com/lp/…?cid=…)" />
    <button class="btn btn-secondary" onclick="stampFromUrl(document.getElementById('manual-url').value)">Stamp from URL</button>
  </div>
  <button class="btn btn-secondary" style="font-size:.75rem" onclick="toggleManual()" data-i18n="ss_enter_manual">Enter barcode URL manually instead</button>
</div>

<script>
(function(){
  'use strict';
  var API = window.API_ORIGIN;
  var PIN_LEN = 4;
  var pinBuffer = '';
  var pinSlug = new URLSearchParams(window.location.search).get('slug') || '';
  var scanning = false;
  var animFrame = null;

  // ── PIN gate / lockout / staff session ──
  function showPinGate(){
    document.getElementById('pin-gate').style.display='flex';
    document.getElementById('pin-locked').style.display='none';
    document.getElementById('scanner-wrap').style.display='none';
  }
  // No PIN configured: no camera, no manual entry, no "Continue anyway" —
  // the only way forward is the owner setting a PIN in Loyalty Settings.
  function showLocked(){
    document.getElementById('pin-gate').style.display='none';
    document.getElementById('pin-locked').style.display='flex';
    document.getElementById('scanner-wrap').style.display='none';
  }
  function showScanner(){
    document.getElementById('pin-gate').style.display='none';
    document.getElementById('pin-locked').style.display='none';
    document.getElementById('scanner-wrap').style.display='flex';
  }

  // Staff session is a signed server-issued token, not a boolean — a
  // sessionStorage flag alone proves nothing to the backend, which is why
  // every staff API call below sends this token and the backend
  // independently verifies it on every request.
  function getStaffSession(slug){
    try{
      var raw = sessionStorage.getItem('staff_session_'+slug);
      if(!raw) return null;
      var s = JSON.parse(raw);
      if(!s || !s.token || !s.expiresAt || s.expiresAt <= Date.now()) return null;
      return s;
    }catch(e){ return null; }
  }
  function setStaffSession(slug, token, expiresAt){
    try{ sessionStorage.setItem('staff_session_'+slug, JSON.stringify({token:token, expiresAt:expiresAt})); }catch(e){}
  }
  function clearStaffSession(slug){
    try{ sessionStorage.removeItem('staff_session_'+slug); }catch(e){}
  }
  function staffAuthHeaders(slug){
    var s = getStaffSession(slug);
    return s ? {'X-Staff-Token': s.token} : {};
  }
  // Called when any staff API call comes back 401 staff_auth_required /
  // staff_session_expired — the local session is no longer trustworthy
  // regardless of what sessionStorage still says, so re-gate immediately.
  function handleStaffAuthFailure(slug, errCode){
    clearStaffSession(slug);
    pinBuffer=''; updatePinDots();
    document.getElementById('pin-err').textContent = errCode === 'staff_session_expired'
      ? ((window.SS_T&&window.SS_T.ss_session_expired)||'Your staff session expired. Enter your PIN again.')
      : '';
    showPinGate();
  }
  // Shared 401 handling for every staff-only API call below (preview, stamp,
  // redeem). Returns true if this WAS an auth failure — caller must stop
  // rendering anything from the response body in that case.
  function handleStaffAuthError(res, d, slug){
    if(res.status === 401 && d && (d.error === 'staff_auth_required' || d.error === 'staff_session_expired')){
      handleStaffAuthFailure(slug, d.error);
      return true;
    }
    return false;
  }

  var lockoutTimer = null;
  function showLockoutCountdown(retryAfterMs){
    var el = document.getElementById('pin-err');
    var until = Date.now() + (retryAfterMs || 30000);
    if(lockoutTimer) clearInterval(lockoutTimer);
    var grid = document.getElementById('pin-grid');
    if(grid) grid.style.pointerEvents = 'none';
    function tick(){
      var remain = Math.ceil((until - Date.now())/1000);
      if(remain <= 0){
        clearInterval(lockoutTimer); lockoutTimer = null;
        if(grid) grid.style.pointerEvents = '';
        el.textContent = '';
        return;
      }
      el.textContent = ((window.SS_T&&window.SS_T.ss_locked)||'Too many attempts. Try again in') + ' ' + remain + 's';
    }
    tick();
    lockoutTimer = setInterval(tick, 250);
  }

  function updatePinDots(){
    var dots = document.querySelectorAll('.pin-dot');
    dots.forEach(function(d,i){ d.classList.toggle('filled', i < pinBuffer.length); });
  }

  window.pinKey = function(k){
    if(lockoutTimer) return; // locked out — ignore taps
    if(pinBuffer.length >= PIN_LEN) return;
    pinBuffer += k;
    updatePinDots();
    document.getElementById('pin-err').textContent = '';
    if(pinBuffer.length === PIN_LEN) submitPin();
  };

  window.pinDel = function(){
    pinBuffer = pinBuffer.slice(0,-1);
    updatePinDots();
  };

  async function submitPin(){
    var slug = pinSlug;
    if(!slug){ document.getElementById('pin-err').textContent = 'No program slug in URL.'; pinBuffer=''; updatePinDots(); return; }
    try{
      var res = await fetch(API+'/lp/staff-pin/'+encodeURIComponent(slug)+'/verify', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({pin: pinBuffer})
      });
      var d = await res.json();
      if(res.status === 429 && d.error === 'staff_locked'){
        pinBuffer=''; updatePinDots();
        showLockoutCountdown(d.retryAfterMs);
        return;
      }
      if(res.ok && d.ok && d.staffToken){
        setStaffSession(slug, d.staffToken, d.expiresAt);
        showScanner();
      } else {
        document.getElementById('pin-err').textContent = d.error === 'No PIN set for this page.' ? (window.SS_T&&window.SS_T.ss_pin_none)||'No PIN set yet' : (window.SS_T&&window.SS_T.ss_pin_wrong)||'Incorrect PIN. Try again.';
        pinBuffer=''; updatePinDots();
      }
    }catch(e){
      document.getElementById('pin-err').textContent = (window.SS_T&&window.SS_T.ss_net_err)||'Network error. Check connection.';
      pinBuffer=''; updatePinDots();
    }
  }

  function checkPinGate(){
    var slug = pinSlug;
    // If no slug in URL, go straight to scanner (owner-accessed without slug)
    if(!slug){ showScanner(); return; }
    // Valid, unexpired signed staff session already on file -> skip PIN.
    if(getStaffSession(slug)){ showScanner(); return; }
    // Status endpoint checks existence only — no PIN guess involved.
    fetch(API+'/lp/staff-pin/'+encodeURIComponent(slug)+'/status', {
      method:'GET'
    }).then(function(r){ return r.json(); }).then(function(d){
      // Correction 2: no unprotected bypass. Not configured -> hard-locked
      // screen, never the scanner. Configured (or an unexpected response
      // shape) -> PIN gate.
      if(d.configured === false){ showLocked(); }
      else { showPinGate(); }
    }).catch(function(){ showPinGate(); }); // request failure -> fail closed
  }

  var stream = null;
  var currentToken = null;
  var lastStampedCid = null;
  var lastStampTime = 0;
  var DEDUPE_MS = 3000; // ignore same cid re-scan within 3s

  // ── Auth ──
  async function getToken(){
    try{ if(window.Clerk&&window.Clerk.session) return await window.Clerk.session.getToken(); }catch(_){}
    return null;
  }

  // ── Load programs ──
  async function loadPrograms(){
    var sel = document.getElementById('slug-select');
    var slugWrap = document.getElementById('slug-wrap');
    // If slug is in the URL, use it directly — staff don't have a logged-in
    // session so the programs API won't work for them anyway.
    if(pinSlug){
      sel.innerHTML = '<option value="' + pinSlug + '">' + pinSlug + '</option>';
      sel.value = pinSlug;
      if(slugWrap) slugWrap.style.display = 'none'; // hide dropdown, slug is fixed
      return;
    }
    // No slug in URL — must be the owner accessing directly, try to load list
    try{
      var tok = await getToken();
      var h = tok ? {'Authorization':'Bearer '+tok} : {};
      var res = await fetch(API+'/loyalty/programs?_='+Date.now(), {headers:h});
      var data = await res.json();
      var progs = (data && data.programs) || [];
      sel.innerHTML = '';
      if(!progs.length){
        sel.innerHTML = '<option value="">No loyalty programs found — add ?slug=YOUR-SLUG to the URL</option>';
        return;
      }
      progs.forEach(function(p){
        var o = document.createElement('option');
        o.value = p.slug;
        o.textContent = p.businessName || p.slug;
        sel.appendChild(o);
      });
    }catch(e){
      sel.innerHTML = '<option value="">Add ?slug=YOUR-SLUG to the URL</option>';
    }
  }

  // ── Fetch stamp token ──
  async function fetchToken(slug){
    var res = await fetch(API+'/lp/stamp/token/'+encodeURIComponent(slug));
    var d = await res.json();
    return d.token;
  }

  // ── Extract cid from scanned URL ──
  function extractCid(url){
    try{
      var u = new URL(url);
      return u.searchParams.get('cid') || null;
    }catch(_){ return null; }
  }

  function extractSlug(url){
    try{
      var u = new URL(url);
      var parts = u.pathname.split('/').filter(Boolean);
      // path is /lp/{slug}
      var idx = parts.indexOf('lp');
      return idx >= 0 && parts[idx+1] ? parts[idx+1] : null;
    }catch(_){ return null; }
  }

  // ── Plain-language error mapping — never show a raw backend status/message ──
  var FRIENDLY = {
    invalid: 'This is not a valid QRAIVY loyalty card.',
    inactive: 'This loyalty program is no longer active.',
    not_found: 'This customer card could not be found.',
    wrong_business: 'This loyalty card belongs to another business.',
    already: 'This customer received a stamp recently.',
    network: "We couldn't connect. Please try again.",
    generic: 'Something went wrong. Please try again.'
  };

  // Hide/show the idle "Start Camera Scanner" + manual-entry controls while
  // a card is being previewed/confirmed, so staff can't start a second scan
  // mid-review.
  function setIdleControlsVisible(visible){
    var d = visible ? '' : 'none';
    document.getElementById('start-btn').style.display = d;
    var divider = document.querySelector('.divider');
    if(divider) divider.style.display = d;
    var manualToggle = document.querySelector('[onclick="toggleManual()"]');
    if(manualToggle) manualToggle.style.display = d;
    if(!visible) document.getElementById('manual-section').style.display = 'none';
  }

  function formatFriendlyDate(iso){
    if(!iso) return 'First visit';
    try{
      var d = new Date(iso);
      return d.toLocaleDateString(undefined, {year:'numeric', month:'short', day:'numeric'});
    }catch(_){ return 'Recently'; }
  }

  function renderError(message){
    var box = document.getElementById('result-box');
    box.innerHTML = '<div class="result err"><div class="stamp-big">❌</div><strong>'+message+'</strong>'
      + '<div class="btn-row"><button class="btn btn-secondary" onclick="scanNextCustomer()">Scan Next Customer</button></div></div>';
    setIdleControlsVisible(true);
  }

  // ── Step 5/6: read-only preview — no stamp can occur from this call ──
  async function previewCard(slug, cid){
    setIdleControlsVisible(false);
    var box = document.getElementById('result-box');
    box.innerHTML = '<div class="result info"><div class="stamp-big">⏳</div><strong>Checking card…</strong></div>';
    var res;
    try{
      res = await fetch(API+'/scanner/'+encodeURIComponent(slug)+'/preview?cid='+encodeURIComponent(cid), {
        headers: staffAuthHeaders(slug)
      });
    }catch(e){
      renderError(FRIENDLY.network);
      return;
    }
    var d;
    try{ d = await res.json(); }catch(e){ renderError(FRIENDLY.network); return; }
    if(handleStaffAuthError(res, d, slug)) return;

    if(d.status === 'ok'){
      renderPreview(slug, cid, d);
    } else if(FRIENDLY[d.status]){
      renderError(FRIENDLY[d.status]);
    } else {
      renderError(FRIENDLY.generic);
    }
  }

  // ── Step 6: confirmation screen — Add 1 Stamp / Cancel ──
  function renderPreview(slug, cid, d){
    var box = document.getElementById('result-box');
    var memberRef = 'Member ending ' + (d.memberRef || '????');
    var statusChip = d.rewardReady
      ? '<span class="status-chip ready">Reward Ready</span>'
      : '<span class="status-chip">Active</span>';
    box.innerHTML =
      '<div class="preview-card">'
      + '<div class="preview-title">Customer card found</div>'
      + '<div class="preview-row"><span class="preview-label">Member</span><span class="preview-value">'+memberRef+'</span></div>'
      + '<div class="preview-row"><span class="preview-label">Current stamps</span><span class="preview-value">'+d.stampCount+' of '+d.goal+'</span></div>'
      + '<div class="preview-row"><span class="preview-label">Reward</span><span class="preview-value">'+(d.rewardName||'')+'</span></div>'
      + '<div class="preview-row"><span class="preview-label">Last visit</span><span class="preview-value">'+formatFriendlyDate(d.lastVisit)+'</span></div>'
      + '<div class="preview-row"><span class="preview-label">Status</span><span class="preview-value">'+statusChip+'</span></div>'
      + '<div class="btn-row">'
      + '<button class="btn btn-primary" onclick="confirmStamp(\''+slug+'\',\''+cid+'\')">Add 1 Stamp</button>'
      + '<button class="btn btn-secondary" onclick="cancelToScanner()">Cancel</button>'
      + '</div></div>';
  }

  window.cancelToScanner = function(){
    document.getElementById('result-box').innerHTML = '';
    setIdleControlsVisible(true);
  };

  window.scanNextCustomer = function(){
    document.getElementById('result-box').innerHTML = '';
    setIdleControlsVisible(true);
    startScanner();
  };

  window.doneScanning = function(){
    stopScanner();
    document.getElementById('result-box').innerHTML = '';
    setIdleControlsVisible(true);
    history.back();
  };

  // ── Step 7/8/9: only this, triggered by the explicit "Add 1 Stamp" tap,
  // calls the staff-only stamp route (Correction 1) — same handler as the
  // public customer NFC route server-side, reached via a separate,
  // staff-session-gated path so the customer route needs no auth change. ──
  window.confirmStamp = async function(slug, cid){
    var box = document.getElementById('result-box');
    box.innerHTML = '<div class="result info"><div class="stamp-big">⏳</div><strong>Stamping…</strong></div>';
    var res, d;
    try{
      if(!currentToken) currentToken = await fetchToken(slug);
      res = await fetch(API+'/scanner/'+encodeURIComponent(slug)+'/'+currentToken+'/stamp', {
        method: 'POST',
        headers: Object.assign({'Content-Type':'application/json'}, staffAuthHeaders(slug)),
        body: JSON.stringify({cid: cid})
      });
      d = await res.json();
    }catch(e){
      renderError(FRIENDLY.network);
      return;
    }
    currentToken = null; // token may be consumed/rotated — fetch fresh next time
    if(handleStaffAuthError(res, d, slug)) return;

    if(d.status === 'ok'){
      lastStampedCid = cid; lastStampTime = Date.now();
      if(d.rewardReady){ renderRewardUnlocked(slug, cid, d); }
      else { renderStampSuccess(d); }
    } else if(d.status === 'already'){
      lastStampedCid = cid; lastStampTime = Date.now();
      renderError(FRIENDLY.already);
    } else if(FRIENDLY[d.status]){
      renderError(FRIENDLY[d.status]);
    } else {
      renderError(FRIENDLY.generic);
    }
  };

  function renderStampSuccess(d){
    var box = document.getElementById('result-box');
    box.innerHTML =
      '<div class="result ok"><div class="stamp-big">✅</div><strong>Stamp added</strong>'
      + '<div style="margin-top:6px">This customer now has '+d.newCount+' of '+d.goal+' stamps.</div>'
      // The backend never reports whether the Apple/Google Wallet push
      // itself succeeded (it's caught and logged server-side only) — so
      // this note is shown on every success, never a claimed "Wallet
      // updated" confirmation we can't actually verify from the response.
      + '<div style="font-size:.72rem;opacity:.65;margin-top:6px">The stamp was saved. The Wallet card may take a moment to refresh.</div>'
      + '<div class="btn-row"><button class="btn btn-primary" onclick="scanNextCustomer()">Scan Next Customer</button>'
      + '<button class="btn btn-secondary" onclick="doneScanning()">Done</button></div></div>';
    setIdleControlsVisible(true);
  }

  function renderRewardUnlocked(slug, cid, d){
    var box = document.getElementById('result-box');
    box.innerHTML =
      '<div class="result ok"><div class="stamp-big">🎁</div><strong>Reward unlocked</strong>'
      + '<div style="margin-top:6px;font-weight:700">'+(d.rewardName||'')+'</div>'
      + '<div style="font-size:.72rem;opacity:.65;margin-top:6px">The stamp was saved. The Wallet card may take a moment to refresh.</div>'
      + '<div class="btn-row"><button class="btn btn-primary" onclick="redeemReward(\''+slug+'\',\''+cid+'\')">Mark as redeemed</button>'
      + '<button class="btn btn-secondary" onclick="scanNextCustomer()">Scan Next Customer</button>'
      + '<button class="btn btn-secondary" onclick="doneScanning()">Done</button></div></div>';
    setIdleControlsVisible(true);
  }

  // ── Redeem — staff-only route (Correction 1), same underlying handler as
  // the public customer redeem-confirm endpoint, no separate reward
  // system. ──
  window.redeemReward = async function(slug, cid){
    var box = document.getElementById('result-box');
    box.innerHTML = '<div class="result info"><div class="stamp-big">⏳</div><strong>Redeeming…</strong></div>';
    var res, d;
    try{
      var token = await fetchToken(slug);
      res = await fetch(API+'/scanner/'+encodeURIComponent(slug)+'/'+token+'/redeem', {
        method: 'POST',
        headers: Object.assign({'Content-Type':'application/json'}, staffAuthHeaders(slug)),
        body: JSON.stringify({cid: cid})
      });
      d = await res.json();
    }catch(e){
      renderError(FRIENDLY.network);
      return;
    }
    if(handleStaffAuthError(res, d, slug)) return;
    if(d.status === 'ok'){
      box.innerHTML = '<div class="result ok"><div class="stamp-big">🎉</div><strong>Reward redeemed</strong>'
        + '<div style="margin-top:6px">'+(d.rewardName||'')+' — enjoy!</div>'
        + '<div class="btn-row"><button class="btn btn-primary" onclick="scanNextCustomer()">Scan Next Customer</button>'
        + '<button class="btn btn-secondary" onclick="doneScanning()">Done</button></div></div>';
      setIdleControlsVisible(true);
    } else if(d.status === 'not_ready'){
      renderError('This customer is not ready to redeem yet.');
    } else {
      renderError(FRIENDLY.generic);
    }
  };

  // The scanner's own business context (?slug= from the launching page) is
  // authoritative — it must never be silently overridden by whatever
  // business a scanned card happens to belong to. sel.value only matters
  // as a fallback for the no-?slug= owner-direct-access case.
  function getActiveSlug(){
    var sel = document.getElementById('slug-select');
    return pinSlug || (sel && sel.value) || '';
  }

  // Never preview or stamp before this passes. A scanned card whose own URL
  // encodes a different slug than the scanner's active business must be
  // rejected outright, before the preview endpoint is even called — not
  // silently stamped into the wrong business's Pass/LoyaltyCustomer records.
  function rejectIfWrongBusiness(activeSlug, slugFromUrl){
    if(slugFromUrl && activeSlug && slugFromUrl !== activeSlug){
      renderError(FRIENDLY.wrong_business);
      return true;
    }
    return false;
  }

  // ── Scan/manual entry -> read-only preview (never stamps by itself) ──
  window.stampFromUrl = async function(url){
    if(!url || !url.trim()){ setResult('err','❌','No URL','Please scan or paste a barcode URL.'); return; }
    url = url.trim();
    var cid = extractCid(url);
    var slugFromUrl = extractSlug(url);
    var slug = getActiveSlug() || slugFromUrl;
    if(!slug){ setResult('err','❌',(window.SS_T&&window.SS_T.ss_no_slug)||'No program selected',''); return; }
    if(!cid){ setResult('err','❌','No customer ID','This barcode doesn\'t contain a customer ID. Make sure customers add the wallet pass fresh so the new barcode is generated.'); return; }
    if(rejectIfWrongBusiness(slug, slugFromUrl)) return;
    await previewCard(slug, cid);
  };

  // ── UI result display ──
  function setResult(type, icon, title, sub){
    var box = document.getElementById('result-box');
    box.innerHTML = '<div class="result '+type+'"><div class="stamp-big">'+icon+'</div><strong>'+title+'</strong>'+(sub?'<br><span style="font-size:.75rem;opacity:.8">'+sub+'</span>':'')+'</div>';
  }

  // ── Camera scanner ──
  window.startScanner = async function(){
    var box = document.getElementById('camera-box');
    var btn = document.getElementById('start-btn');
    if(scanning){ stopScanner(); return; }
    try{
      stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
      var video = document.getElementById('video');
      video.srcObject = stream;
      await video.play();
      box.style.display = 'block';
      btn.textContent = (window.SS_T&&window.SS_T.ss_stop)||'Stop Scanner';
      btn.className = 'btn btn-secondary';
      scanning = true;
      tickScan();
    }catch(e){
      setResult('err','❌',(window.SS_T&&window.SS_T.ss_cam_err)||'Camera error',e.message);
      document.getElementById('manual-section').style.display='block';
    }
  };

  function stopScanner(){
    scanning = false;
    if(animFrame) cancelAnimationFrame(animFrame);
    if(stream) stream.getTracks().forEach(function(t){t.stop();});
    stream = null;
    document.getElementById('camera-box').style.display='none';
    var btn = document.getElementById('start-btn');
    btn.textContent = (window.SS_T&&window.SS_T.ss_start)||'Start Camera Scanner';
    btn.className = 'btn btn-primary';
  }

  function tickScan(){
    if(!scanning) return;
    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');
    if(video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var code = jsQR(imageData.data, imageData.width, imageData.height, {inversionAttempts:'dontInvert'});
      if(code && code.data){
        var url = code.data;
        var cid = extractCid(url);
        // dedupe: ignore same cid for 3 seconds
        if(cid && !(cid === lastStampedCid && Date.now() - lastStampTime < DEDUPE_MS)){
          var slugFromUrl = extractSlug(url);
          var slug = getActiveSlug() || slugFromUrl;
          if(slug){
            stopScanner();
            if(rejectIfWrongBusiness(slug, slugFromUrl)){ return; }
            previewCard(slug, cid);
            return;
          }
        }
      }
    }
    animFrame = requestAnimationFrame(tickScan);
  }

  window.toggleManual = function(){
    var s = document.getElementById('manual-section');
    s.style.display = s.style.display === 'none' ? 'block' : 'none';
  };

  // ── Boot ──
  // ── Branding — business logo (or a colored initial fallback), name, and
  // brand color shown on the PIN gate, the locked screen, and the scanner
  // itself. Reuses the existing public /manifest/:slug endpoint (already
  // exposes name/theme_color/icon for the PWA manifest) rather than adding
  // a new backend surface. ──
  function applyBrand(brand){
    var name = (brand.name || '').trim();
    var initial = (name.charAt(0) || 'Q').toUpperCase();
    var color = brand.color || '#ff5a1f';
    // /manifest/:slug falls back to the generic Qraivy icon when no
    // business logo was uploaded — treat that specific fallback as "no
    // logo" so the initial-letter avatar shows instead of a generic mark.
    var logoUrl = (brand.logoUrl && !/\/icon-(192|512)\.png$/.test(brand.logoUrl)) ? brand.logoUrl : '';
    ['pin-logo','locked-logo','scan-logo'].forEach(function(id){
      var el = document.getElementById(id);
      if(!el) return;
      el.style.background = color;
      el.innerHTML = logoUrl ? '<img src="'+logoUrl+'" alt="">' : initial;
    });
    ['pin-bizname','locked-bizname','scan-bizname'].forEach(function(id){
      var el = document.getElementById(id);
      if(el) el.textContent = name;
    });
    var scanBrand = document.getElementById('scan-brand');
    if(scanBrand) scanBrand.style.display = 'flex';
  }

  function loadBranding(slug){
    if(!slug) return;
    fetch(API+'/manifest/'+encodeURIComponent(slug)).then(function(r){ return r.json(); }).then(function(m){
      applyBrand({
        name: m && m.name,
        color: m && m.theme_color,
        logoUrl: m && m.icons && m.icons[0] && m.icons[0].src
      });
    }).catch(function(){});
  }

  function boot(){
    loadBranding(pinSlug);
    checkPinGate();
    loadPrograms();
    if(window.Clerk){
      window.Clerk.load().then(function(){
        var u = window.Clerk.user;
        if(!u){ window.location.href = 'index.html'; }
      });
    }
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
