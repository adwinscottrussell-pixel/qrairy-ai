<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="QRAIRY" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #05082e;
      --surface: #0d1240;
      --surface2: #151a4a;
      --border: #1e2560;
      --accent: #ff5a1f;
      --text: #ffffff;
      --text-dim: #6b7280;
      --text-mid: #9ca3af;
      --font-display: 'Inter', sans-serif;
      --font-mono: 'DM Mono', monospace;
      --radius: 8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-display);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hero-section {
      padding: 48px 24px 32px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .business-badge {
      display: inline-block;
      background: var(--accent);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    .business-name {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .business-url {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-dim);
    }

    .business-url a { color: var(--accent); text-decoration: none; }
    .business-url a:hover { text-decoration: underline; }

    .chat-section {
      flex: 1;
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .chat-intro {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--text-dim);
      text-align: center;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .chat-messages {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 300px;
      max-height: 400px;
      overflow-y: auto;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .message {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 85%;
    }

    .message.bot { align-self: flex-start; }
    .message.user { align-self: flex-end; }

    .message-bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 0.88rem;
      line-height: 1.6;
    }

    .message.bot .message-bubble {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .message.user .message-bubble {
      background: var(--accent);
      color: #fff;
    }

    .message-sender {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 0 4px;
    }

    .message.user .message-sender { text-align: right; }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: fit-content;
    }

    .typing-dot {
      width: 6px;
      height: 6px;
      background: var(--text-dim);
      border-radius: 50%;
      animation: typingBounce 1.2s infinite;
    }

    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    .chat-input-row { display: flex; gap: 8px; }

    #chatInput {
      flex: 1;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #chatInput:focus { border-color: var(--accent); }
    #chatInput::placeholder { color: var(--text-dim); }

    #sendBtn {
      padding: 14px 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: var(--font-display);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    #sendBtn:hover { background: #ff7a45; }
    #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }


    .powered-by {
      text-align: center;
      padding: 16px;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-dim);
      letter-spacing: 0.05em;
    }

    .powered-by a { color: var(--accent); text-decoration: none; }

    .loading-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-dim);
      z-index: 100;
    }
  </style>
  <link rel="stylesheet" href="sidebar.css?v=3">
  <script src="js/url-config.js"></script>
</head>
<body>

  <div class="loading-screen" id="loadingScreen">Loading...</div>

  <div id="pageContent" style="display:none; flex-direction:column; min-height:100vh;">
    <div class="hero-section">
      <div class="business-badge">Welcome</div>
      <div class="business-name" id="businessName">...</div>
      <div class="business-url">
        Visit us at <a id="businessUrl" href="#" target="_blank">...</a>
      </div>
    </div>

    <div class="chat-section">
      <div class="chat-intro">Ask us anything</div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Ask a question about us..." />
        <button id="sendBtn">Send</button>
      </div>
    </div>

    <div class="powered-by">Powered by <a id="powered-by-link" href="https://www.qraivy.com" target="_blank">QRAIRY.AI</a></div>
  </div>

  <script>
    const API_BASE = window.API_ORIGIN;
    document.getElementById('powered-by-link').href = window.PUBLIC_APP_ORIGIN;
    const params = new URLSearchParams(window.location.search);
    const qrId = params.get('id');
    let chatHistory = [];
    let businessData = null;

    async function init() {
      if (!qrId) {
        document.getElementById('loadingScreen').textContent = 'Invalid QR code.';
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/visit/${qrId}`);
        const data = await res.json();
        businessData = data;
        document.title = `Welcome to ${data.businessName}`;
        document.getElementById('businessName').textContent = data.businessName;
        document.getElementById('businessUrl').textContent = data.originalUrl;
        document.getElementById('businessUrl').href = data.originalUrl;
        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('pageContent').style.display = 'flex';
        addMessage('bot', `Hi! Welcome to ${data.businessName} 👋 How can I help you today?`);
      } catch (err) {
        document.getElementById('loadingScreen').textContent = 'Failed to load. Please try again.';
        console.error(err);
      }
    }

    function addMessage(role, text) {
      const messages = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.innerHTML = `
        <div class="message-sender">${role === 'bot' ? businessData?.businessName || 'Assistant' : 'You'}</div>
        <div class="message-bubble">${text}</div>
      `;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function addTyping() {
      const messages = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = 'message bot';
      div.id = 'typingIndicator';
      div.innerHTML = `
        <div class="typing-indicator">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      `;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    function removeTyping() {
      const typing = document.getElementById('typingIndicator');
      if (typing) typing.remove();
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      const message = input.value.trim();
      if (!message) return;
      input.value = '';
      sendBtn.disabled = true;
      addMessage('user', message);
      chatHistory.push({ role: 'user', content: message });
      addTyping();
      try {
        const res = await fetch(`${API_BASE}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ qrId, message, history: chatHistory.slice(-6) }),
        });
        const data = await res.json();
        removeTyping();
        addMessage('bot', data.reply);
        chatHistory.push({ role: 'assistant', content: data.reply });
      } catch (err) {
        removeTyping();
        addMessage('bot', 'Sorry, something went wrong. Please try again.');
        console.error(err);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('chatInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    init();
  </script>
  <script src="sidebar.js?v=3"></script>
</body>
</html>
