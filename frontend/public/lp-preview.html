<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<style>*{margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden}iframe{width:100%;height:100%;border:none;}</style>
<script src="js/url-config.js"></script>
</head>
<body>
<iframe id="inner" src=""></iframe>
<script>
  var p = new URLSearchParams(window.location.search);
  var slug = p.get('slug');
  var t = p.get('t') || '';
  var inner = document.getElementById('inner');
  if (slug) {
    inner.src = window.API_ORIGIN + '/lp/' + encodeURIComponent(slug) + '?preview=1' + (t ? '&t=' + t : '');
  }
  // Listen for theme CSS from parent editor
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'QRAIVY_THEME_CSS') {
      inner.addEventListener('load', function applyOnce() {
        try {
          var doc = inner.contentDocument;
          if (!doc) return;
          var el = doc.getElementById('qraivy-theme-preview');
          if (!el) { el = doc.createElement('style'); el.id = 'qraivy-theme-preview'; doc.head.appendChild(el); }
          el.textContent = e.data.css;
        } catch(err) {}
        inner.removeEventListener('load', applyOnce);
      });
      // Also try immediately if already loaded
      try {
        var doc = inner.contentDocument;
        if (doc && doc.head) {
          var el = doc.getElementById('qraivy-theme-preview');
          if (!el) { el = doc.createElement('style'); el.id = 'qraivy-theme-preview'; doc.head.appendChild(el); }
          el.textContent = e.data.css;
        }
      } catch(err) {}
    }
  });
</script>
</body>
</html>
