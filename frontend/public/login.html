<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QRAIRY.AI — Sign In</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: #0d1117;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif;
    }
    .login-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 32px;
    }
    .logo {
      font-size: 1.6rem; font-weight: 900; color: #fff; letter-spacing: -0.03em;
    }
    .logo span { color: #ff5a1f; font-style: italic; }
    #clerk-sign-in { width: 100%; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="logo">QR<span>Aivy</span></div>
    <div id="clerk-sign-in"></div>
  </div>

  <script>
    // Return target after sign-in/sign-up: only a same-site relative path
    // (e.g. "dashboard.html?section=billing&plan=pro_annual"); anything with
    // a scheme, protocol-relative or backslash form falls back to the
    // dashboard, so ?redirect= can never send users off-site.
    function _safeRedirect(raw) {
      let r = typeof raw === 'string' ? raw.trim() : '';
      if (!r || /^[a-z][a-z0-9+.-]*:/i.test(r) || r.indexOf('//') === 0 || r.indexOf('\\') !== -1) return 'dashboard.html';
      r = r.replace(/^\/+/, '');
      return r || 'dashboard.html';
    }
    async function initClerk() {
      await window.Clerk.load();
      const _rp = _safeRedirect(new URLSearchParams(window.location.search).get('redirect'));
      if (window.Clerk.user) {
        window.location.href = _rp;
        return;
      }
      // Production returns to www; plan-preview stays on its own host.
      const _base = window.location.hostname === 'plan-preview.qraivy.com' ? window.location.origin + '/' : 'https://www.qraivy.com/';
      const _target = _base + _rp;
      window.Clerk.mountSignIn(document.getElementById('clerk-sign-in'), {
        afterSignInUrl: _target,
        afterSignUpUrl: _target,
        redirectUrl: _target
      });
    }
  </script>
  <script
    data-clerk-publishable-key="pk_live_Y2xlcmsucXJhaXZ5LmNvbSQ"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
    type="text/javascript"
    onload="initClerk()"
  ></script>
</body>
</html>
