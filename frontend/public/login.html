<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QRAIRY.AI — Sign In</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: #0d1117;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif;
    }
    .login-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 32px;
    }
    .logo {
      font-size: 1.6rem; font-weight: 900; color: #fff; letter-spacing: -0.03em;
    }
    .logo span { color: #ff5a1f; font-style: italic; }
    #clerk-sign-in { width: 100%; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="logo">QR<span>Aivy</span></div>
    <div id="clerk-sign-in"></div>
  </div>

  <script>
    // Same open-redirect guard as claim-business.html -- only a same-origin
    // relative path is ever used as a redirect target. auth-guard.js (used
    // by every protected page) builds the ?redirect= value this page reads
    // below from that page's own pathname+search, but this is the actual
    // safety boundary: it is never trusted just because it came from our
    // own auth-guard.js, exactly as if it had come from an arbitrary link.
    function safeRedirectPath(raw) {
      if (!raw) return null;
      if (!raw.startsWith('/') || raw.startsWith('//') || raw.includes('://')) return null;
      return raw;
    }

    async function initClerk() {
      await window.Clerk.load();
      if (window.Clerk.user) {
        const _r = new URLSearchParams(window.location.search).get('redirect');
        window.location.href = safeRedirectPath(_r) || 'dashboard.html';
        return;
      }
      const _rp = new URLSearchParams(window.location.search).get('redirect');
      const _base = 'https://www.qraivy.com/';
      const _safe = safeRedirectPath(_rp);
      // _safe is guaranteed to start with exactly one '/' (never '//') by
      // safeRedirectPath, so slice(1) drops it cleanly instead of producing
      // a double slash against _base's own trailing '/'.
      const _target = _safe ? _base + _safe.slice(1) : _base + 'dashboard.html';
      window.Clerk.mountSignIn(document.getElementById('clerk-sign-in'), {
        afterSignInUrl: _target,
        afterSignUpUrl: _target,
        redirectUrl: _target
      });
    }
  </script>
  <script
    data-clerk-publishable-key="pk_live_Y2xlcmsucXJhaXZ5LmNvbSQ"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
    type="text/javascript"
    onload="initClerk()"
  ></script>
</body>
</html>
