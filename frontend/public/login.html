<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QRAIRY.AI — Sign In</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: #0d1117;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif;
    }
    .login-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 32px;
    }
    .logo {
      font-size: 1.6rem; font-weight: 900; color: #fff; letter-spacing: -0.03em;
    }
    .logo span { color: #ff5a1f; font-style: italic; }
    #clerk-sign-in { width: 100%; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="logo">QR<span>Aivy</span></div>
    <div id="clerk-sign-in"></div>
  </div>

  <script>
    // Same-origin-only local-path validator for the `redirect` query
    // param. Existing call sites in this codebase pass it two ways --
    // with a leading slash (admin-guard.js, stadtpocket-admin-guard.js,
    // claim-business.html's window.location.pathname) and without one
    // (smart-preview.html's 'dashboard.html?claimDemo=...', upgrade.html's
    // 'dashboard.html?launch=onboarding') -- both are accepted. Rejected:
    // any scheme (http:, https:, javascript:, data:, ...), a
    // protocol-relative "//host" prefix, and anything containing a
    // backslash (blocks backslash-based host tricks some browsers still
    // normalize as "/"). Nothing here can ever produce a cross-origin
    // navigation -- see initClerk()'s two use sites below.
    function isSafeLocalPath(p) {
      if (typeof p !== 'string' || !p) return false;
      if (p.indexOf('\\') !== -1) return false;
      if (p.indexOf('//') === 0) return false;
      if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(p)) return false;
      if (p.indexOf('://') !== -1) return false;
      return true;
    }

    async function initClerk() {
      await window.Clerk.load();
      const _rp = new URLSearchParams(window.location.search).get('redirect');
      const _safePath = isSafeLocalPath(_rp) ? _rp : null;

      if (window.Clerk.user) {
        // Unvalidated `_r` previously reached window.location.href
        // directly here -- an open-redirect exposure independent of the
        // Preview-origin bug this fix targets, closed here using the
        // same validator rather than left half-fixed.
        window.location.href = _safePath || 'dashboard.html';
        return;
      }
      // The real current origin the page is actually running on --
      // never a hardcoded hostname, so this is correct on both
      // production and any Vercel Preview deployment with no
      // per-environment configuration. Strips a leading slash from
      // _safePath (if present) before joining, so a path passed either
      // convention above never produces a doubled "//" in _target.
      const _base = window.location.origin + '/';
      const _target = _base + (_safePath ? _safePath.replace(/^\/+/, '') : 'dashboard.html');
      window.Clerk.mountSignIn(document.getElementById('clerk-sign-in'), {
        afterSignInUrl: _target,
        afterSignUpUrl: _target,
        redirectUrl: _target
      });
    }
  </script>
  <script
    data-clerk-publishable-key="pk_live_Y2xlcmsucXJhaXZ5LmNvbSQ"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
    type="text/javascript"
    onload="initClerk()"
  ></script>
</body>
</html>
