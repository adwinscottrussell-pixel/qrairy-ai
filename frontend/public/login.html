<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QRAIRY.AI — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; background: #0d1117;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', sans-serif;
    }
    .login-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 32px;
    }
    .logo {
      font-size: 1.6rem; font-weight: 900; color: #fff; letter-spacing: -0.03em;
    }
    .logo span { color: #ff5a1f; font-style: italic; }
    #clerk-sign-in { width: 100%; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="logo">QR<span>Aivy</span></div>
    <div id="clerk-sign-in"></div>
  </div>

  <script>
    // Only ever a same-origin relative path: must start with exactly one
    // '/' (never '//', which browsers treat as protocol-relative to an
    // arbitrary host) and never contain '://' (an absolute URL to another
    // origin). Anything else falls back to the default target instead of
    // being used — this is what prevents the `redirect` query param from
    // becoming an open redirect.
    function safeRedirectPath(raw) {
      if (!raw) return null;
      if (!raw.startsWith('/') || raw.startsWith('//') || raw.includes('://')) return null;
      return raw;
    }

    async function initClerk() {
      // Same-origin target, derived from the actual current origin — not
      // hardcoded to production — so production stays on production and
      // any preview deployment stays on that same preview after sign-in.
      const _origin = window.location.origin + '/';
      const _rp = safeRedirectPath(new URLSearchParams(window.location.search).get('redirect'));
      const _target = _origin + (_rp ? _rp.replace(/^\//, '') : 'dashboard.html');

      await window.Clerk.load();
      if (window.Clerk.user) {
        window.location.href = _target;
        return;
      }
      window.Clerk.mountSignIn(document.getElementById('clerk-sign-in'), {
        afterSignInUrl: _target,
        afterSignUpUrl: _target,
        redirectUrl: _target
      });
    }
  </script>
  <script
    data-clerk-publishable-key="pk_live_Y2xlcmsucXJhaXZ5LmNvbSQ"
    src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
    type="text/javascript"
    onload="initClerk()"
  ></script>
</body>
</html>
